<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Glassware :p</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game-container">
            <canvas id="GameCanvas" width="720" height="480">
            </canvas>
            <div id="main-menu" class="game-ui-layer">
                <h1>Glassware</h1>
                <button id="btn-start">Jugar</button>
            </div>
            <div id="pause-menu" class="game-ui-layer hidden">
                <h2>Juego Pausado</h2>
                <button id="btn-resume">Continuar [Esc]</button>
                <button id="btn-exit">Salir al Menú</button>
            </div>
            <div id="game-over-menu" class="game-ui-layer hidden">
                <h2 style="color: #a00e0e;">HAS MUERTO</h2>
                <button id="btn-restart">Reiniciar</button>
            </div>
        </div>
    </body>
    <script type="module" src="js/main.js"></script>
</html>
