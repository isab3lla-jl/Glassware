<!DOCTYPE html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Glassware :p</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="game-container">
            <canvas id="GameCanvas" width="720" height="480">
            </canvas>
            

            <div id="fade-overlay" class="hidden"></div>
            <div id="main-menu" class="game-ui-layer">
                <div class="language-switcher-container">
                    <select id="language-switcher">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                    </select>
                </div>
                <div class="content">
                    <h1>Glassware</h1>

                    <button id="btn-start" data-lang="play">Play</button>
                    <button id="btn-out" data-lang="back">Go Back</button>
                </div>
            </div>
            <div id="pause-menu" class="game-ui-layer hidden">
                <h2 data-lang="pause">Pause</h2>
                <button id="btn-resume" data-lang="cont">Continue (Esc)</button>
                <button class="btn-exit" data-lang="main">Main Menu</button>
            </div>
            <div id="game-over-menu" class="game-ui-layer hidden">
                <h2 style="color: #a00e0e;" data-lang="ded">YOU'VE BEEN CONSUMED</h2>
                <button class="btn-restart" data-lang="res">Restart</button>
                <button class="btn-exit" data-lang="main">Main Menu</button>
            </div>
            <div id="game-end-menu" class="game-ui-layer hidden">
                <h2 data-lang="end">THE END...</h2>
                <p data-lang="end_p">Thanks for playing!</p>
                <button class="btn-restart" data-lang="res">Restart</button>
                <button class="btn-exit" data-lang="main">Main Menu</button>
            </div>
        </div>
    </body>
    <script type="module" src="js/main.js"></script>
    <script>
        document.getElementById('language-switcher').addEventListener('change', function() {
            let lang = this.value;
            loadLanguageFile(lang);
        });

        function loadLanguageFile(lang) {
            fetch(`data/languagesUI/${lang}.json`)
                .then(response => response.json())
                .then(data => applyTranslations(data));
            }

        function applyTranslations(translations) {
            const elements = document.querySelectorAll('[data-lang]');
            elements.forEach(element => {
                const key = element.getAttribute('data-lang');
                element.innerText = translations[key];
            });
        }
    </script>
</html>
